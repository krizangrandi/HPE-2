name: Controllo disponibilità

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # permette di lanciarlo a mano dal tab Actions

permissions:
  contents: write             # serve per salvare state.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Controlla il prodotto
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Salva lo stato
        run: |
          git config user.name "stock-monitor"
          git config user.email "stock-monitor@users.noreply.github.com"
          git add state.txt || true
          git diff --cached --quiet || (git commit -m "Aggiorna stato" && git push)
